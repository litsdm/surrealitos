[package]
name = "surrealitos"
version = "0.1.0"
edition = "2024"

[features]
default = ["serde-flexible"]
serde-flexible = ["dep:serde"]
patched-serde = ["dep:serde-pinned"]

[dependencies]
thiserror = "2.0.12"
serde_json = "1.0.93"
serde = { version = "1", features = ["derive"], optional = true }
serde-pinned = { package = "serde", version = "=1.0.219", features = ["derive"], optional = true }
surrealdb = { version = "2.3.6", features = ["protocol-ws", "native-tls"] }
